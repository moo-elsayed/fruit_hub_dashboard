name: fruit_hub_dashboard
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- UI & Styling ---
  cupertino_icons: ^1.0.9
  flutter_screenutil: ^5.9.3
  toastification: ^3.2.0
  google_fonts: ^8.2.1
  flutter_svg: ^2.3.0
  skeletonizer: ^2.1.3
  cached_network_image: ^3.4.1
  gap: ^3.0.1

  # --- Animations ---
  animate_do: ^5.1.0
  flutter_animate: ^4.5.2
  animated_text_kit: ^4.3.0

  # --- State Management & Service Locator ---
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  get_it: ^9.2.1

  # --- Local Storage & Utilities ---
  shared_preferences: ^2.5.5
  logger: ^2.7.0

  # --- Media Handling ---
  image_picker: ^1.2.3
  flutter_image_compress: ^2.5.1

  # --- Security & Environment ---
  envied: ^1.3.8

  # --- Backend (Firebase) ---
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  firebase_storage: ^13.0.4
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # --- Testing ---
  mocktail: ^1.0.5
  fake_cloud_firestore: ^4.2.0
  bloc_test: ^10.0.0

  # --- Code Generation ---
  envied_generator: ^1.3.8
  build_runner: ^2.15.1

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/svgs/
    - assets/svgs/icons/